<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morphic Lab 0.2</title><style>body{margin:0;background:#101a20;color:#d8e8e2;font:15px system-ui}#view{height:58vh;position:relative}canvas{display:block;touch-action:none}#status{position:absolute;top:12px;left:12px;z-index:1}section{padding:14px}label{display:block;margin:8px 0}input{width:100%;accent-color:#79bba5}button{padding:12px;background:#315e54;color:white;border:0;border-radius:8px}a{color:#9ed4c4}</style><div id="view"><span id="status">Lade Grafik…</span></div><section><b>MORPHIC RESONANCE / 0.2</b><label>Frequenz<input id="freq" type="range" min=".3" max="3" step=".1" value="1"></label><label>Resonanz<input id="amp" type="range" min="0" max="2" step=".05" value="1"></label><label>Verschmelzung<input id="blend" type="range" min=".05" max="1.3" step=".05" value=".65"></label><label>Morphs <span id="num">8</span><input id="count" type="range" min="2" max="24" value="8"></label><button id="pulse">Impuls</button> <button id="quality">Qualität: Mobil</button> <a href="v01.html">Version 0.1</a><p>Ziehen: Kamera · Tippen: Resonanzimpuls</p></section><script type="module">
try{
const T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');const $=id=>document.getElementById(id),view=$('view'),r=new T.WebGLRenderer({antialias:false});view.append(r.domElement);let high=false,yaw=.4,pitch=.25,t=0,imp=-100,drag=null;
const u={res:{value:new T.Vector2()},time:{value:0},age:{value:100},freq:{value:1},amp:{value:1},blend:{value:.65},count:{value:8},yaw:{value:yaw},pitch:{value:pitch},centers:{value:Array.from({length:24},()=>new T.Vector3())}};
const mat=new T.ShaderMaterial({uniforms:u,vertexShader:'void main(){gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:`
precision highp float;
uniform vec2 res;uniform float time,age,freq,amp,blend,yaw,pitch;uniform int count;uniform vec3 centers[24];
float sm(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float wave(vec3 p){float d=length(p-vec3(1.2,0.,0.));return sin(d*11.-age*9.)*exp(-pow((d-age*1.7)*1.4,2.))*exp(-age*.18);}
float field(vec3 p){float d=100.;for(int i=0;i<24;i++){if(i>=count)break;vec3 q=p-centers[i];float s=length(q)-(.54+.08*sin(time*freq*2.+float(i)));d=sm(d,s,blend);}return d+.035*sin(p.x*9.+time)*sin(p.y*8.)*sin(p.z*7.)+.09*amp*wave(p);}
vec3 normal(vec3 p){vec2 e=vec2(.009,0.);return normalize(vec3(field(p+e.xyy)-field(p-e.xyy),field(p+e.yxy)-field(p-e.yxy),field(p+e.yyx)-field(p-e.yyx)));}
void main(){vec2 uv=(gl_FragCoord.xy*2.-res)/res.y;vec3 ro=8.*vec3(cos(pitch)*sin(yaw),sin(pitch),cos(pitch)*cos(yaw));vec3 f=normalize(-ro),right=normalize(cross(f,vec3(0,1,0))),up=cross(right,f);vec3 rd=normalize(f*1.8+uv.x*right+uv.y*up);vec3 bg=mix(vec3(.045,.075,.095),vec3(.16,.24,.23),clamp(.5+rd.y,0.,1.));float dist=0.;bool hit=false;for(int j=0;j<72;j++){float d=field(ro+rd*dist);if(d<.012){hit=true;break;}dist+=max(.012,d*.65);if(dist>17.)break;}vec3 col=bg;if(hit){vec3 p=ro+rd*dist,n=normal(p),l=normalize(vec3(-.6,1.,.7));float diffuse=max(0.,dot(n,l));float rim=pow(1.-max(0.,dot(n,-rd)),3.);float bands=.5+.5*sin(p.y*12.+p.x*4.+sin(p.z*5.)+time*freq);vec3 base=mix(vec3(.075,.24,.20),vec3(.38,.48,.27),smoothstep(.35,.8,bands));float w=abs(wave(p))*amp;col=base*(.35+diffuse*.95)+rim*vec3(.13,.25,.24)+w*vec3(.55,.95,.65);col=mix(col,bg,1.-exp(-dist*.035));}gl_FragColor=vec4(pow(max(col,0.),vec3(.85)),1.);}
`});const scene=new T.Scene();scene.add(new T.Mesh(new T.PlaneGeometry(2,2),mat));const cam=new T.Camera();
function resize(){r.setPixelRatio(high?Math.min(devicePixelRatio,1.5):.85);r.setSize(view.clientWidth,view.clientHeight);r.getDrawingBufferSize(u.res.value)}new ResizeObserver(resize).observe(view);resize();$('quality').onclick=()=>{high=!high;$('quality').textContent='Qualität: '+(high?'Hoch':'Mobil');resize()};$('pulse').onclick=()=>imp=t;
r.domElement.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,m:0};r.domElement.setPointerCapture(e.pointerId)};r.domElement.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;yaw-=dx*.008;pitch=Math.max(-1.1,Math.min(1.1,pitch+dy*.008));drag.m+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY};r.domElement.onpointerup=()=>{if(drag&&drag.m<8)imp=t;drag=null};
let last=performance.now(),fps=60;function frame(now){let dt=(now-last)/1000;last=now;t+=Math.min(dt,.05);fps=.94*fps+.06/Math.max(dt,.001);let c=+$('count').value;u.count.value=c;$('num').textContent=c;u.time.value=t;u.age.value=t-imp;u.freq.value=+$('freq').value;u.amp.value=+$('amp').value;u.blend.value=+$('blend').value;u.yaw.value=yaw;u.pitch.value=pitch;for(let i=0;i<c;i++){let a=i*2.39996+t*.15,rad=1.15+.55*Math.sin(i*2.1+t*.7);u.centers.value[i].set(Math.cos(a)*rad,Math.sin(i*3.4+t*.6)*.8,Math.sin(a)*rad)}r.render(scene,cam);$('status').textContent=Math.round(fps)+' FPS · '+c+' Morphs';requestAnimationFrame(frame)}requestAnimationFrame(frame);
}catch(e){document.getElementById('status').textContent='Fehler: '+e.message}
</script></html>
