<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morphic Resonance Lab</title><style>body{margin:0;background:#101820;color:#dcebe8;font:15px system-ui}canvas{display:block;touch-action:none}section{padding:16px}label{display:block;margin:10px 0}input{width:100%;accent-color:#80d4bd}button{padding:12px;background:#285b56;color:white;border:0;border-radius:8px}#view{height:55vh;position:relative}#status{position:absolute;top:10px;left:10px;z-index:1;pointer-events:none}</style><div id="view"><span id="status">Lade 3D-Modul…</span></div><section><b>MORPHIC RESONANCE / 0.1</b><label>Frequenz <input id="freq" type="range" min=".2" max="4" step=".1" value="1.2"></label><label>Kopplung <input id="couple" type="range" min="0" max="8" step=".1" value="3"></label><label>Elastizität <input id="elastic" type="range" min=".1" max="1.5" step=".1" value=".7"></label><button id="pulse">Resonanzimpuls</button> <button id="reset">Reset</button><p>Ansicht mit dem Finger drehen. Antippen erzeugt einen Impuls.</p></section><script type="module">
try{
const T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
const view=document.querySelector('#view'),status=document.querySelector('#status'),scene=new T.Scene();scene.background=new T.Color(0x101820);scene.fog=new T.FogExp2(0x101820,.045);
const camera=new T.PerspectiveCamera(45,1,.1,100),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));view.append(r.domElement);
scene.add(new T.HemisphereLight(0xc5fff1,0x293044,2));const light=new T.DirectionalLight(0xffe8bd,3);light.position.set(3,6,4);scene.add(light);
const grid=new T.GridHelper(30,30,0x37554f,0x233332);grid.position.y=-2;scene.add(grid);
const nodes=[];for(let i=0;i<10;i++){const g=new T.IcosahedronGeometry(.65,4),base=g.attributes.position.array.slice(),m=new T.MeshStandardMaterial({color:new T.Color().setHSL(.42+i*.025,.48,.38),roughness:.58,flatShading:true,emissive:0x164438});const mesh=new T.Mesh(g,m);let a=i*2.39996;mesh.position.set(Math.cos(a)*(1.4+i*.16),Math.sin(i*4)*.7,Math.sin(a)*(1.4+i*.16));scene.add(mesh);nodes.push({mesh,base,x:0,v:0});}
const links=[];for(let i=0;i<10;i++)for(let j=i+1;j<10;j++){let d=nodes[i].mesh.position.distanceTo(nodes[j].mesh.position);if(d<3.2){let g=new T.BufferGeometry().setFromPoints([nodes[i].mesh.position,nodes[j].mesh.position]);let l=new T.Line(g,new T.LineBasicMaterial({color:0x65c8ad,transparent:true,opacity:.15}));scene.add(l);links.push({i,j,l,w:1/d});}}
let yaw=.4,pitch=.35,drag=null;function impulse(){nodes[0].v+=5}document.querySelector('#pulse').onclick=impulse;document.querySelector('#reset').onclick=()=>nodes.forEach(n=>{n.x=0;n.v=0});r.domElement.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,m:0};r.domElement.setPointerCapture(e.pointerId)};r.domElement.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;yaw-=dx*.008;pitch=Math.max(-1,Math.min(1,pitch+dy*.008));drag.m+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY};r.domElement.onpointerup=()=>{if(drag&&drag.m<8)impulse();drag=null};
function resize(){let w=view.clientWidth,h=view.clientHeight;r.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(view);resize();
let last=performance.now(),fps=60,t=0;function frame(now){let raw=(now-last)/1000;last=now;let dt=Math.min(.025,raw);fps=.95*fps+.05/Math.max(raw,.001);t+=dt;let f=+document.querySelector('#freq').value,k=+document.querySelector('#couple').value,e=+document.querySelector('#elastic').value;let acc=nodes.map((n,i)=>-Math.pow(2*Math.PI*f,2)*n.x-.8*n.v+(i===0?.8*Math.sin(t*f*6.28):0));for(let {i,j,w,l} of links){let force=k*w*(nodes[j].x-nodes[i].x);acc[i]+=force;acc[j]-=force;l.material.opacity=Math.min(.9,.12+Math.abs(force)*.3)}nodes.forEach((n,i)=>{n.v+=acc[i]*dt;n.x+=n.v*dt;let p=n.mesh.geometry.attributes.position;for(let j=0;j<p.count;j++){let a=j*3,x=n.base[a],y=n.base[a+1],z=n.base[a+2],s=1+e*(.10*Math.sin(x*7+y*4+t*f*2+i)+.22*Math.tanh(n.x)*Math.cos(z*5+x*3));p.setXYZ(j,x*s,y*s,z*s)}p.needsUpdate=true;n.mesh.material.emissiveIntensity=.2+Math.min(2,Math.abs(n.x)*2)});camera.position.set(8*Math.cos(pitch)*Math.sin(yaw),8*Math.sin(pitch),8*Math.cos(pitch)*Math.cos(yaw));camera.lookAt(0,0,0);r.render(scene,camera);status.textContent=Math.round(fps)+' FPS · WebGL · 10 Morphs';requestAnimationFrame(frame)}impulse();requestAnimationFrame(frame);
}catch(e){document.querySelector('#status').textContent='3D konnte nicht gestartet werden: '+e.message}
</script></html>
